@let movieData = movie();
@if(movieData){
<div class="relative h-[60vw] w-full">
  <div class="absolute inset-0">
    <img src="https://image.tmdb.org/t/p/w500{{movieData.backdrop_path}}" alt="{{movieData.title}}"
      class="object-cover w-full h-full">
    <div class="absolute inset-0 bg-gradient-to-r from-black via-black/50 to-transparent"></div>
  </div>

  <div class="relative flex items-center h-full">
    <div class="w-full px-4 md:px-16 md:2/3 lg:w-1/2">
      <h1 class="mb-4 text-3xl font-black text-white md:text-5xl uppercase">{{movieData.title}}</h1>
      <p class="mb-8 text-sm text-white">{{movieData.overview}}</p>

      <div class="flex gap-3">
        <button class="w-full h-20 px-8 py-2 text-red-500 bg-white border-2 border-red-500 hover:bg-white font-black uppercase">
           Reproducir
        </button>

        <button class="w-full h-20 px-8 py-2 text-white  bg-red-500 border-2 border-white font-bold uppercase">
          Más información
        </button>
      </div>
    </div>
  </div>
</div>
}
